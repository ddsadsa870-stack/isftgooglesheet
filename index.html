<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISFT Instituti - Asosiy Sahifa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00d2ff;
        }
        p {
            color: #cfd8dc;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
            background: linear-gradient(90deg, #00c6ff, #0072ff);
        }
        .btn-3d {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
            color: #1a1a1a;
        }
        .btn-3d:hover {
            background: linear-gradient(90deg, #ffd200, #f7971e);
            box-shadow: 0 6px 20px rgba(255, 210, 0, 0.6);
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #90a4ae;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ISFT Instituti</h1>
        <p>Kerakli bo'limni tanlang:</p>
        
        <div class="menu">
            <!-- 1. So'rovnoma -->

            <!-- 2. 1-Taqdimot -->
            <a href="https://docs.google.com/presentation/d/1S5nYMrX3QoUHDKmttdzyECRMEHQ-2feb8gkIsjPyU4k/edit?usp=sharing" target="_blank" class="btn">📊 1-Taqdimot: Institut haqida ma'lumot</a>
            
            <!-- 3. 2-Taqdimot -->
            <a href="https://docs.google.com/presentation/d/14TRMTYI7tOB3i70u88NYtFEzSpeKNN0mo6x0uAE5NaE/edit?usp=sharing" target="_blank" class="btn">🎯 2-Taqdimot: Yo'nalishlar</a>
            
            <!-- 4. 3D Bino -->
            <a href="https://www.cgtrader.com/ai-3d-model-generator/3d-models/modern-residential-building-3d-model-knwqayhwaaz" target="_blank" class="btn btn-3d">🏢 ISFT 3D bino ko'rinishi</a>
            
            <!-- 5. Google Sheet -->
            <a href="https://docs.google.com/spreadsheets/d/1GnLa3CWho69MP6BiiIkoohcB1-skUrvFcVB_YBmK4As/edit?usp=sharing" target="_blank" class="btn">📋 Talabalar ro'yxati (Google Sheet)</a>
        </div>
    </div>

    <footer>
        &copy; 2026 ISFT. Barcha huquqlar himoyalangan.
    </footer>

</body>
</html>
